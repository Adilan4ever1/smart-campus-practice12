- btnRunTests:
    Control: Classic/Button
    Properties:
      Text: ="Run all tests"
      OnSelect: |-
        =Set(varBookingsBefore, JSON(Bookings));
        ClearCollect(colTests,
            {ID: "T1", Name: "Valid free interval", Expected: "AVAILABLE", Observed: ReasonCode(DateTime(2027, 2, 1, 13, 30, 0), "60", false, Now())},
            {ID: "T2", Name: "Overlap with BK-1", Expected: "OVERLAP", Observed: ReasonCode(DateTime(2027, 2, 1, 9, 30, 0), "60", false, Now())},
            {ID: "T3", Name: "Blocked room", Expected: "ROOM_BLOCKED", Observed: ReasonCode(DateTime(2027, 2, 1, 13, 30, 0), "60", true, Now())},
            {ID: "T4", Name: "Duration = 0", Expected: "INVALID_DURATION", Observed: ReasonCode(DateTime(2027, 2, 1, 13, 30, 0), "0", false, Now())},
            {ID: "T5", Name: "Duration = 121", Expected: "INVALID_DURATION", Observed: ReasonCode(DateTime(2027, 2, 1, 13, 30, 0), "121", false, Now())},
            {ID: "T6", Name: "Past start time", Expected: "START_IN_PAST", Observed: ReasonCode(DateTime(2026, 11, 20, 10, 0, 0), "60", false, Now())},
            {ID: "T7", Name: "Adjacent 10:30-12:00", Expected: "AVAILABLE", Observed: ReasonCode(DateTime(2027, 2, 1, 10, 30, 0), "90", false, Now())}
        );
        Collect(colTests, {ID: "T8", Name: "Bookings unchanged", Expected: "UNCHANGED", Observed: If(JSON(Bookings) = varBookingsBefore && CountRows(Bookings) = 3, "UNCHANGED", "CHANGED")});
        Set(varTestsRun, Now())
      Fill: =RGBA(232, 238, 252, 1)
      HoverFill: =RGBA(214, 224, 250, 1)
      Color: =RGBA(36, 83, 199, 1)
      FontWeight: =FontWeight.Semibold
      Size: =11
      X: =1176
      Y: =345
      Width: =140
      Height: =34
