- btnCheck:
    Control: Classic/Button
    Properties:
      Text: ="Check availability"
      OnSelect: |-
        =With(
            {s: If(IsBlank(dpStart.SelectedDate), Blank(), DateTime(Year(dpStart.SelectedDate), Month(dpStart.SelectedDate), Day(dpStart.SelectedDate), ddHour.Selected.Value, ddMinute.Selected.Value, 0))},
            With(
                {c: ReasonCode(s, txtDuration.Text, tglBlocked.Value, Now())},
                Set(varCode, c);
                Set(varMessage, ResultMessage(c, s, txtDuration.Text));
                Set(varChecked, true)
            )
        )
      Fill: =RGBA(36, 83, 199, 1)
      HoverFill: =RGBA(28, 66, 160, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Semibold
      Size: =12
      X: =50
      Y: =348
      Width: =260
      Height: =44
- rectResult:
    Control: Rectangle
    Properties:
      Visible: =varChecked
      Fill: =Switch(varCode, "AVAILABLE", RGBA(230, 245, 236, 1), "OVERLAP", RGBA(253, 236, 234, 1), "ROOM_BLOCKED", RGBA(253, 236, 234, 1), RGBA(255, 245, 220, 1))
      BorderColor: =Switch(varCode, "AVAILABLE", RGBA(183, 226, 200, 1), "OVERLAP", RGBA(245, 194, 189, 1), "ROOM_BLOCKED", RGBA(245, 194, 189, 1), RGBA(240, 217, 160, 1))
      BorderThickness: =1
      X: =50
      Y: =410
      Width: =600
      Height: =130
- lblResultTitle:
    Control: Label
    Properties:
      Visible: =varChecked
      Text: =If(varCode = "AVAILABLE", "Available", varCode in ["OVERLAP", "ROOM_BLOCKED"], "Unavailable", "Check your input")
      Color: =lblResultMsg.Color
      X: =66
